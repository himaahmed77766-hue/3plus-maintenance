 $('back').style.visibility=(historyStack.length||!['home','control'].includes(page))?'visible':'hidden';wire()};function stats(arr){return `<div class="stats">${arr.map(([label,val])=>`<div class="stat"><span class="small">${label}</span><b>${esc(val)}</b></div>`).join('')}</div>`};function head(t,s=''){return `<div class="flex"><h2>${t}</h2><span class="small">${s}</span></div>`};function shopView(){let rs=state.repairs,received=rs.reduce((n,r)=>n+(+r.paid||0),0);switch(page){case 'repairNew':return wizardView();case 'repairDetail':return repairDetail();case 'repairStatus':return statusView();case 'home':return `<div class="hero"><div><h2>أهلًا بك في 3PLUS</h2><div class="muted">برنامج إدارة صيانة الهواتف</div></div><span style="font-size:40px">✦</span></div><div class="tiles"><button class="tile" onclick="go('dashboard')"><span class="emoji">📊</span><strong>لوحة التحكم</strong><p>البيانات والإحصائيات ومتابعة أداء المحل</p></button><button class="tile" onclick="go('repairs')"><span class="emoji">🔧</span><strong>صيانة</strong><p>إدارة أجهزة الصيانة ومتابعة حالتها</p></button><button class="tile red" onclick="go('losses')"><span class="emoji">↩️</span><strong>مرتجع أو خسارة</strong><p>تسجيل المرتجعات والخسائر</p></button></div>`;case 'dashboard':return head('لوحة التحكم','أرقام توضيحية من بيانات المعاينة')+stats([['إجمالي الصيانات',rs.length],['في المحل',rs.filter(x=>!['تم التسليم','مرفوض'].includes(x.status)).length],['جاهز للاستلام',rs.filter(x=>x.status==='جاهز للاستلام').length],['إجمالي المقبوض',fmt(received)]])+`<div class="panel" style="margin-top:16px"><h3>آخر الصيانات</h3>${repairTable(rs.slice(-5))}</div>`;case 'repairs':return head('إدارة الصيانة')+`<div class="actions"><button class="btn" id="newRepair">+ إضافة صيانة جديدة</button></div><div class="panel">${`<div class="repaircards">${rs.slice().reverse().map(r=>`<button class="repaircard" data-open-repair="${r.id}"><span><strong>#${r.id} — ${esc(r.device)}</strong><small>${esc(r.client)} · ${esc(r.fault)}</small></span><span class="status">${esc(r.status)}</span></button>`).join('')}</div>`}</div>`;case 'records':return head('سجل الصيانات')+`<div class="panel">${repairTable(rs)}</div>`;case 'losses':return head('مرتجع أو خسارة')+`<div class="actions"><button class="btn red" id="newLoss">+ تسجيل عملية</button></div><div class="panel"><div class="tablewrap"><table><tr><th>النوع</th><th>السبب</th><th>المبلغ</th><th>التاريخ</th></tr>${state.losses.map(x=>`<tr><td>${esc(x.kind)}</td><td>${esc(x.reason)}</td><td>${fmt(x.amount)}</td><td>${esc(x.date)}</td></tr>`).join('')}</table></div></div>`;case 'accounts':return head('الدرج والحسابات')+stats(Object.entries(state.accounts).map(([k,v])=>[k,fmt(v)]))+`<div class="actions"><button class="btn" id="newMove">+ حركة مالية تجريبية</button></div><div class="panel"><h3>آخر الحركات</h3>${state.movements.map(x=>`<p>${esc(x.date)} — ${esc(x.account)} — ${esc(x.kind)} — ${fmt(x.amount)}</p>`).join('')||'<p class="muted">لا توجد حركات</p>'}</div>`;case 'daily':return head('التقفيل اليومي')+`<div class="panel"><h3>موعد التقفيل: 3:00 فجرًا</h3><p>الرصيد الإجمالي التجريبي: ${fmt(Object.values(state.accounts).reduce((a,b)=>a+(+b||0),0))}</p><p class="muted">التقفيل الحقيقي والتقارير الموثوقة يحتاجان ربط العمليات المالية بالسيرفر.</p></div>`;case 'monthly':return head('الأرباح الشهرية')+`<div class="panel"><h3>تقرير الأرباح</h3><p class="muted">هذه الشاشة تصميمية فقط. حساب الجملة وصافي الربح والمصروفات سيعمل بعد ربط مخطط Supabase والتحقق من الصلاحيات.</p></div>`;case 'settings':return head('إعدادات المحل')+`<div class="panel"><h3>الإعدادات المسموح بها</h3>${Object.entries(state.permissions).filter(([k,v])=>v).map(([k])=>`<p>✅ ${esc(({settings:'عرض الإعدادات',staff:'إدارة الموظفين',opening:'الرصيد الافتتاحي',closing:'موعد التقفيل',branding:'تغيير الهوية',whatsapp:'واتساب'})[k])}</p>`).join('')}<p class="muted">مدى الإتاحة الفعلي يحكمه السيرفر بعد مرحلة الربط.</p></div>`;case 'support':return head('الدعم الفني')+`<div class="panel">رقم الدعم: <a href="tel:01020524213">01020524213</a></div>`;default:return ''}}
function repairTable(rs){return `<div class="tablewrap"><table><thead><tr><th>الرقم</th><th>العميل</th><th>الجهاز</th><th>العطل</th><th>السعر</th><th>المتبقي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rs.map(r=>`<tr><td>#${r.id}</td><td>${esc(r.client)}</td><td>${esc(r.device)}</td><td>${esc(r.fault)}</td><td>${fmt(r.price)}</td><td>${fmt((+r.price||0)-(+r.paid||0))}</td><td><span class="status">${esc(r.status)}</span></td><td><button class="btn alt" data-edit="${r.id}">تعديل</button></td></tr>`).join('')}</tbody></table></div>`}
function ownerView(){switch(page){case 'control':return `<div class="controlHeader"><h2>🛡️ لوحة مالك النظام — 3PLUS Control</h2><p>تجربة لإدارة المحلات وشكلها وصلاحيات الإعدادات. ليست لوحة تحكم حقيقية على السيرفر.</p></div>`+stats([['المحلات',state.shops.length],['نشط',state.shops.filter(x=>x.active).length],['موقوف',state.shops.filter(x=>!x.active).length],['الاشتراكات','تجريبية']])+`<div class="tiles" style="margin-top:18px"><button class="tile" onclick="go('shops')"><span class="emoji">🏬</span>إدارة المحلات</button><button class="tile" onclick="go('theme')"><span class="emoji">🎨</span>الألوان والقوالب</button><button class="tile" onclick="go('users')"><span class="emoji">👥</span>الصلاحيات</button></div>`;case 'shops':return head('إدارة المحلات')+`<div class="actions"><button class="btn" id="addShop">+ إضافة محل تجريبي</button></div><div class="panel">${state.shops.map(s=>`<div class="perm"><span>${esc(s.name)} <span class="tag">${s.active?'نشط':'موقوف'}</span></span><button class="btn alt" data-shop="${s.id}">${s.active?'إيقاف':'تفعيل'}</button></div>`).join('')}</div>`;case 'users':return head('المستخدمون والصلاحيات')+`<div class="panel"><h3>ما يُسمح للعميل بتعديله</h3><p class="muted">الإعدادات محدودة افتراضيًا حسب اختيار مالك النظام.</p>${Object.entries(state.permissions).map(([k,v])=>`<label class="perm"><span>${esc(({settings:'إظهار قسم الإعدادات',staff:'إدارة الموظفين',opening:'تعديل الرصيد الافتتاحي',closing:'تعديل موعد التقفيل',branding:'تغيير اللون واللوجو',whatsapp:'إعدادات واتساب'})[k])}</span><input type="checkbox" class="switch" data-perm="${k}" ${v?'checked':''}></label>`).join('')}</div><p class="muted">دي تغييرات معاينة محلية فقط. منع الصلاحيات الحقيقي يحتاج سياسات RLS واختبارها.</p>`;case 'theme':return head('التحكم في الألوان والقوالب')+`<div class="panel"><h3>اللون الأساسي</h3><div class="colors">${['#f4c542','#3589e7','#30bc7e','#9c6aec','#db5b61'].map(c=>`<button aria-label="لون ${c}" title="${c}" class="swatch ${state.color===c?'selected':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div><h3 style="margin-top:24px">القالب</h3><div class="fields"><div class="field"><label>قالب واجهة المحل</label><select id="template"><option value="cards" ${state.template==='cards'?'selected':''}>كروت كبيرة — التصميم المعتمد</option><option value="classic" ${state.template==='classic'?'selected':''}>كلاسيكي (مخطط للتنفيذ)</option><option value="compact" ${state.template==='compact'?'selected':''}>مختصر (مخطط للتنفيذ)</option></select></div></div><p class="muted">تغيير اللون يعمل في المعاينة؛ القوالب الأخرى لم تُبرمج كواجهات مستقلة بعد.</p></div>`;case 'order':return head('ترتيب الأقسام')+`<div class="panel"><p class="muted">تغيير ترتيب القائمة في هذه المعاينة فقط:</p>${state.order.map((k,i)=>`<div class="perm"><span>${esc(({dashboard:'لوحة التحكم',repairs:'صيانة',losses:'مرتجع أو خسارة',accounts:'الدرج والحسابات',daily:'التقفيل اليومي',monthly:'الأرباح الشهرية',records:'سجل الصيانات',settings:'الإعدادات'})[k])}</span><span><button class="btn alt" data-up="${i}" aria-label="رفع">↑</button> <button class="btn alt" data-down="${i}" aria-label="خفض">↓</button></span></div>`).join('')}</div>`;case 'subscriptions':return head('الاشتراكات')+`<div class="panel"><h3>الاشتراكات المدفوعة</h3><p class="muted">شكل القسم جاهز للمعاينة. الدفع الحقيقي، تاريخ انتهاء الباقات، وتعليق حساب العميل لم تُنفّذ بعد.</p></div>`;case 'updates':return head('التحديثات والدعم')+`<div class="panel"><h3>التحديثات والنسخ الاحتياطي</h3><p class="muted">يحتاج التنفيذ الحقيقي آليات سيرفر، وجدولة آمنة وتجربة استرجاع، وليس HTML فقط.</p></div>`;default:return ''}}
function modal(title,body,fn){$('mt').textContent=title;$('mb').innerHTML=body;$('merr').textContent='';dlgSave=fn;$('modal').showModal()};function field(name,id,value='',type='text'){return `<div class="field"><label for="f_${id}">${name}</label><input id="f_${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''} required></div>`};function v(id){return $('f_'+id).value.trim()};function editRepair(id){let r=state.repairs.find(x=>x.id===id)||{client:'',phone:'',device:'',fault:'',price:0,paid:0,status:statuses[0]};modal(id?'تعديل الصيانة':'إضافة صيانة جديدة',`<div class="fields">${field('اسم العميل','client',r.client)}${field('رقم الموبايل','phone',r.phone)}${field('نوع الجهاز','device',r.device)}${field('العطل','fault',r.fault)}${field('السعر','price',r.price,'number')}${field('المقبوض','paid',r.paid,'number')}<div class="field"><label>حالة الصيانة</label><select id="f_status">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`,()=>{if(!v('client')||!v('device')||!v('fault'))throw Error('أكمل بيانات العميل والجهاز والعطل');if(+v('paid')>+v('price'))throw Error('المقبوض أكبر من السعر');Object.assign(r,{client:v('client'),phone:v('phone'),device:v('device'),fault:v('fault'),price:+v('price'),paid:+v('paid'),status:v('status')});if(!id){r.id=Date.now();r.date=new Date().toISOString().slice(0,10);state.repairs.push(r)}persist()})}function wire(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRepair(+b.dataset.edit));if($('newRepair'))$('newRepair').onclick=()=>{wizardData={};wizardStep=0;go('repairNew')};
document.querySelectorAll('[data-open-repair]').forEach(b=>b.onclick=()=>{selectedRepair=+b.dataset.openRepair;go('repairDetail')});
if($('wizardBack'))$('wizardBack').onclick=()=>back();
if($('wizardNext'))$('wizardNext').onclick=()=>{
 saveWizardFields();
 if(wizardStep===0&&!wizardData.device?.trim())return alert('اكتب نوع الجهاز');
 if(wizardStep===1&&(!wizardData.client?.trim()||!wizardData.phone?.trim()))return alert('اكتب اسم العميل ورقم الهاتف');
 if(wizardStep===2){
 if(!wizardData.fault?.trim())return alert('اكتب وصف العطل');
 if((+wizardData.price||0)<(+wizardData.paid||0))return alert('العربون أكبر من سعر الصيانة');
 const id=Math.max(1000,...state.repairs.map(x=>x.id))+1;
 state.repairs.push({id,client:wizardData.client,phone:wizardData.phone,device:wizardData.device+(wizardData.model?' '+wizardData.model:''),fault:wizardData.fault,price:+wizardData.price||0,paid:+wizardData.paid||0,status:'تم الاستلام',date:new Date().toISOString().slice(0,10)});
 selectedRepair=id;historyStack.push({page:'repairs',control:false});page='repairDetail';persist();return
 }wizardStep++;render();
};
if($('changeStatus'))$('changeStatus').onclick=()=>go('repairStatus');
if($('editExisting'))$('editExisting').onclick=()=>editRepair(selectedRepair);
if($('waCustomer'))$('waCustomer').onclick=()=>{const r=state.repairs.find(x=>x.id===selectedRepair);const digits=(r.phone||'').replace(/\D/g,'');if(!/^01\d{9}$/.test(digits))return alert('رقم الهاتف غير صالح لواتساب المصري');window.open('https://wa.me/20'+digits.slice(1)+'?text='+encodeURIComponent('أهلاً '+r.client+'، حالة صيانة جهازك رقم #'+r.id+': '+r.status),'_blank')};
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const r=state.repairs.find(x=>x.id===selectedRepair);r.status=statuses[+b.dataset.status];page='repairDetail';persist()});
if($('newLoss'))$('newLoss').onclick=()=>modal('إضافة مرتجع أو خسارة',`<div class="fields"><div class="field"><label>النوع</label><select id="f_kind"><option>خسارة</option><option>مرتجع</option></select></div>${field('السبب','reason')}${field('المبلغ','amount',0,'number')}</div>`,()=>{if(!v('reason')||+v('amount')<=0)throw Error('أدخل سببًا ومبلغًا صحيحًا');state.losses.push({kind:v('kind'),reason:v('reason'),amount:+v('amount'),date:new Date().toISOString().slice(0,10)});persist()});if($('newMove'))$('newMove').onclick=()=>modal('حركة مالية تجريبية',`<div class="fields"><div class="field"><label>الحساب</label><select id="f_account">${Object.keys(state.accounts).map(a=>`<option>${a}</option>`).join('')}</select></div><div class="field"><label>نوع الحركة</label><select id="f_kind"><option value="in">إيداع</option><option value="out">سحب</option></select></div>${field('المبلغ','amount',0,'number')}</div>`,()=>{const n=+v('amount'),a=v('account'),k=v('kind');if(n<=0)throw Error('المبلغ يجب أن يكون أكبر من صفر');if(k==='out'&&state.accounts[a]<n)throw Error('الرصيد غير كافٍ');state.accounts[a]+=(k==='in'?n:-n);state.movements.unshift({account:a,kind:k==='in'?'إيداع':'سحب',amount:n,date:new Date().toISOString().slice(0,10)});persist()});if($('addShop'))$('addShop').onclick=()=>modal('إضافة محل للمعاينة',field('اسم المحل','name'),()=>{if(!v('name'))throw Error('اكتب اسم المحل');state.shops.push({id:Date.now(),name:v('name'),active:true,plan:'تجريبي'});persist()});document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{const s=state.shops.find(s=>s.id==b.dataset.shop);s.active=!s.active;persist()});document.querySelectorAll('[data-perm]').forEach(b=>b.onchange=()=>{state.permissions[b.dataset.perm]=b.checked;persist()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;persist()});if($('template'))$('template').onchange=e=>{state.template=e.target.value;persist()};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;if(i>0){[state.order[i-1],state.order[i]]=[state.order[i],state.order[i-1]];persist()}});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;if(i<state.order.length-1){[state.order[i+1],state.order[i]]=[state.order[i],state.order[i+1]];persist()}})};$('menu').onclick=()=>$('side').classList.toggle('open');$('mode').onclick=switchControl;$('back').onclick=back;$('cancel').onclick=()=>$('modal').close();$('save').onclick=()=>{try{dlgSave?.();$('modal').close()}catch(e){$('merr').textContent=e.message}};$('logout').onclick=()=>alert('تسجيل الدخول والخروج الحقيقي غير مفعّل في نسخة المعاينة.');$('language').onclick=()=>alert('الترجمة الإنجليزية ضمن مرحلة التنفيذ التالية.');render();
</script></body></html>
