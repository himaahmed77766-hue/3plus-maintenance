<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d0e12"><title>3PLUS — معاينة البرنامج والكنترول</title><style>
:root{--gold:#f4c542;--bg:#0d0e12;--panel:#181a20;--line:#37332a;--text:#f6f1e5;--muted:#aaa9aa;--danger:#f06e73;--ok:#36bf8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}a{color:var(--gold)}.shell{max-width:1420px;margin:auto;min-height:100vh}.top{height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:#111318}.brand{font-weight:900;font-size:35px;color:var(--gold);letter-spacing:1px}.toptools{display:flex;align-items:center;gap:8px}.btn{background:var(--gold);border:1px solid var(--gold);color:#17140d;border-radius:10px;padding:11px 14px;font-weight:bold}.btn.alt{background:#22242b;color:var(--gold);border-color:#6b5930}.btn.red{background:#59272a;color:#fff;border-color:#a54649}.small{font-size:12px;color:var(--muted)}.preview{background:#352a14;border-bottom:1px solid #795d24;color:#ffe4a0;padding:10px 20px;font-size:13px;text-align:center}.app{display:flex;min-height:calc(100vh - 120px)}.side{width:240px;flex-shrink:0;background:#13151a;border-left:1px solid var(--line);padding:18px 12px}.navbtn{display:flex;align-items:center;gap:9px;text-align:right;width:100%;background:transparent;color:#e5e1db;border:0;padding:14px;border-radius:11px;margin:4px 0}.navbtn.active{background:linear-gradient(90deg,#a37913,#f4c542);color:#17150e;font-weight:bold}.body{flex:1;min-width:0;padding:24px}.panel{background:var(--panel);border:1px solid #363840;border-radius:16px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(115deg,#493813,#191a20 65%);border:1px solid #78602a;padding:22px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:16px 0}.hero h2{margin:0 0 10px;color:#ffe08b}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:linear-gradient(145deg,#29241b,#181a20);border:1px solid #77602b;color:#fbe0a0;border-radius:16px;padding:22px 16px;min-height:140px;text-align:right}.tile.red{border-color:#af494f;color:#ffaaaa}.tile .emoji{font-size:35px;display:block;margin-bottom:10px}.tile strong{font-size:21px}.tile p{font-size:12px;color:#bdb1a0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#20232a;border:1px solid #383b44;border-radius:13px;padding:17px}.stat b{display:block;font-size:24px;color:var(--gold);margin-top:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:21px}h3{font-size:17px;color:var(--gold);margin:0 0 12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:660px}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid #373941;font-size:13px}th{color:#edca77}.status{display:inline-block;background:#30364b;color:#b9d8ff;padding:5px 9px;border-radius:8px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{color:#f2d78e;font-size:13px}input,select,textarea{width:100%;min-width:0;background:#0f1117;border:1px solid #55545a;color:#fff;border-radius:9px;padding:12px}textarea{min-height:78px}dialog{background:#191b20;color:#fff;border:1px solid #917334;border-radius:16px;width:min(580px,94vw);max-height:88vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}.controlHeader{background:#201b12;border:1px solid #8a702a;padding:18px;border-radius:15px;margin-bottom:15px}.tag{font-size:11px;border-radius:6px;background:#664d16;padding:4px 9px;color:#ffe5ad}.switch{accent-color:#d7a52c;width:20px;height:20px}.perm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #383a3f}.colors{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #999;cursor:pointer}.swatch.selected{outline:2px solid #fff;outline-offset:3px}.hidden{display:none!important}.foot{text-align:center;color:#8e8c8e;font-size:12px;padding:22px}.control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted{color:var(--muted)}@media(max-width:720px){.top{padding:10px;height:68px}.brand{font-size:29px}.toptools .labelhide{display:none}.app{display:block}.side{position:fixed;right:0;top:68px;bottom:0;z-index:4;overflow:auto;transform:translateX(105%);transition:.2s;width:min(320px,85vw);box-shadow:-10px 0 25px #0008}.side.open{transform:translateX(0)}.body{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr}.tile{min-height:110px;padding:16px}.fields,.control-grid{grid-template-columns:1fr}.hero{padding:15px}.hero h2{font-size:19px}#menu{display:inline-block!important}}@media(min-width:721px){#menu{display:none!important}}
</style></head><body><div class="shell"><header class="top"><div class="toptools"><button class="btn alt" id="menu" aria-label="فتح القائمة">☰</button><button class="btn alt" id="logout">⇥ <span class="labelhide">تسجيل الخروج</span></button></div><div class="brand" id="brand">3PLUS</div><div class="toptools"><button class="btn alt" id="language">العربية / EN</button><button class="btn alt" id="mode">⚙️ <span class="labelhide">3PLUS Control</span></button></div></header><div class="preview">نسخة معاينة تفاعلية — البيانات تجريبية محفوظة على هذا الجهاز فقط. لا يوجد ربط بـ Supabase أو نظام اشتراكات حقيقي في هذه النسخة.</div><div class="app"><aside class="side" id="side"></aside><main class="body" id="view"></main></div><div class="foot">3PLUS — تصميم مبدئي للمراجعة قبل ربط السيرفر واختبار الصلاحيات</div></div><dialog id="modal"><h2 id="mt"></h2><div id="mb"></div><div class="actions"><button class="btn" id="save">حفظ</button><button class="btn alt" id="cancel">إلغاء</button></div><p id="merr" style="color:#ff9797"></p></dialog><script>
'use strict';const KEY='3plus-preview-v1';const statuses=['تم الاستلام','تحت الفحص','انتظار قطعة غيار','جاري الإصلاح','جاهز للاستلام','تم التسليم','مرفوض'];const defaults={repairs:[{id:1258,client:'أحمد محمد',phone:'01000000000',device:'iPhone 13',fault:'تغيير شاشة',price:2500,paid:1000,status:'جاري الإصلاح',date:'2026-10-26'}],losses:[],shops:[{id:1,name:'3PLUS - المحل الرئيسي',active:true,plan:'تجريبي'}],color:'#f4c542',template:'cards',order:['dashboard','repairs','losses','accounts','daily','monthly','records','settings'],permissions:{settings:true,staff:false,opening:false,closing:true,branding:false,whatsapp:false},accounts:{'درج المحل':0,'فودافون كاش':0,'إنستا باي':0,'الخزنة':0,'معايا شخصيًا':0},movements:[]};let state;try{state=Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{state=structuredClone(defaults)}let page='home',control=false,dlgSave=null;const $=id=>document.getElementById(id),fmt=x=>(+x||0).toLocaleString('ar-EG')+' ج',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const persist=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};function navItems(){return control?[['control','لوحة المالك','🛡️'],['shops','إدارة المحلات','🏬'],['users','المستخدمون والصلاحيات','👥'],['theme','الألوان والقوالب','🎨'],['order','ترتيب الأقسام','↕️'],['subscriptions','الاشتراكات','💳'],['updates','التحديثات والدعم','🔐']]:[['home','الرئيسية','🏠'],['dashboard','لوحة التحكم','📊'],['repairs','صيانة','🔧'],['losses','مرتجع أو خسارة','↩️'],['accounts','الدرج والحسابات','💰'],['daily','التقفيل اليومي','🗓️'],['monthly','الأرباح الشهرية','📈'],['records','سجل الصيانات','📋'],['settings','الإعدادات','⚙️'],['support','الدعم الفني','🎧']]};function go(p){page=p;$('side').classList.remove('open');render()};function render(){document.documentElement.style.setProperty('--gold',state.color);$('side').innerHTML=`<div class="brand" style="font-size:25px;text-align:center">${control?'3PLUS Control':'3PLUS'}</div>${navItems().filter(x=>control||x[0]!=='settings'||state.permissions.settings).map(([id,label,ico])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span>${ico}</span>${label}</button>`).join('')}`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('view').innerHTML=control?ownerView():shopView();wire()};function stats(arr){return `<div class="stats">${arr.map(([label,val])=>`<div class="stat"><span class="small">${label}</span><b>${esc(val)}</b></div>`).join('')}</div>`};function head(t,s=''){return `<div class="flex"><h2>${t}</h2><span class="small">${s}</span></div>`};function shopView(){let rs=state.repairs,received=rs.reduce((n,r)=>n+(+r.paid||0),0);switch(page){case 'home':return `<div class="hero"><div><h2>أهلًا بك في 3PLUS</h2><div class="muted">برنامج إدارة صيانة الهواتف</div></div><span style="font-size:40px">✦</span></div><div class="tiles"><button class="tile" onclick="go('dashboard')"><span class="emoji">📊</span><strong>لوحة التحكم</strong><p>البيانات والإحصائيات ومتابعة أداء المحل</p></button><button class="tile" onclick="go('repairs')"><span class="emoji">🔧</span><strong>صيانة</strong><p>إدارة أجهزة الصيانة ومتابعة حالتها</p></button><button class="tile red" onclick="go('losses')"><span class="emoji">↩️</span><strong>مرتجع أو خسارة</strong><p>تسجيل المرتجعات والخسائر</p></button></div>`;case 'dashboard':return head('لوحة التحكم','أرقام توضيحية من بيانات المعاينة')+stats([['إجمالي الصيانات',rs.length],['في المحل',rs.filter(x=>!['تم التسليم','مرفوض'].includes(x.status)).length],['جاهز للاستلام',rs.filter(x=>x.status==='جاهز للاستلام').length],['إجمالي المقبوض',fmt(received)]])+`<div class="panel" style="margin-top:16px"><h3>آخر الصيانات</h3>${repairTable(rs.slice(-5))}</div>`;case 'repairs':return head('إدارة الصيانة')+`<div class="actions"><button class="btn" id="newRepair">+ إضافة صيانة جديدة</button></div><div class="panel">${repairTable(rs)}</div>`;case 'records':return head('سجل الصيانات')+`<div class="panel">${repairTable(rs)}</div>`;case 'losses':return head('مرتجع أو خسارة')+`<div class="actions"><button class="btn red" id="newLoss">+ تسجيل عملية</button></div><div class="panel"><div class="tablewrap"><table><tr><th>النوع</th><th>السبب</th><th>المبلغ</th><th>التاريخ</th></tr>${state.losses.map(x=>`<tr><td>${esc(x.kind)}</td><td>${esc(x.reason)}</td><td>${fmt(x.amount)}</td><td>${esc(x.date)}</td></tr>`).join('')}</table></div></div>`;case 'accounts':return head('الدرج والحسابات')+stats(Object.entries(state.accounts).map(([k,v])=>[k,fmt(v)]))+`<div class="actions"><button class="btn" id="newMove">+ حركة مالية تجريبية</button></div><div class="panel"><h3>آخر الحركات</h3>${state.movements.map(x=>`<p>${esc(x.date)} — ${esc(x.account)} — ${esc(x.kind)} — ${fmt(x.amount)}</p>`).join('')||'<p class="muted">لا توجد حركات</p>'}</div>`;case 'daily':return head('التقفيل اليومي')+`<div class="panel"><h3>موعد التقفيل: 3:00 فجرًا</h3><p>الرصيد الإجمالي التجريبي: ${fmt(Object.values(state.accounts).reduce((a,b)=>a+(+b||0),0))}</p><p class="muted">التقفيل الحقيقي والتقارير الموثوقة يحتاجان ربط العمليات المالية بالسيرفر.</p></div>`;case 'monthly':return head('الأرباح الشهرية')+`<div class="panel"><h3>تقرير الأرباح</h3><p class="muted">هذه الشاشة تصميمية فقط. حساب الجملة وصافي الربح والمصروفات سيعمل بعد ربط مخطط Supabase والتحقق من الصلاحيات.</p></div>`;case 'settings':return head('إعدادات المحل')+`<div class="panel"><h3>الإعدادات المسموح بها</h3>${Object.entries(state.permissions).filter(([k,v])=>v).map(([k])=>`<p>✅ ${esc(({settings:'عرض الإعدادات',staff:'إدارة الموظفين',opening:'الرصيد الافتتاحي',closing:'موعد التقفيل',branding:'تغيير الهوية',whatsapp:'واتساب'})[k])}</p>`).join('')}<p class="muted">مدى الإتاحة الفعلي يحكمه السيرفر بعد مرحلة الربط.</p></div>`;case 'support':return head('الدعم الفني')+`<div class="panel">رقم الدعم: <a href="tel:01020524213">01020524213</a></div>`;default:return ''}}
function repairTable(rs){return `<div class="tablewrap"><table><thead><tr><th>الرقم</th><th>العميل</th><th>الجهاز</th><th>العطل</th><th>السعر</th><th>المتبقي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rs.map(r=>`<tr><td>#${r.id}</td><td>${esc(r.client)}</td><td>${esc(r.device)}</td><td>${esc(r.fault)}</td><td>${fmt(r.price)}</td><td>${fmt((+r.price||0)-(+r.paid||0))}</td><td><span class="status">${esc(r.status)}</span></td><td><button class="btn alt" data-edit="${r.id}">تعديل</button></td></tr>`).join('')}</tbody></table></div>`}
function ownerView(){switch(page){case 'control':return `<div class="controlHeader"><h2>🛡️ لوحة مالك النظام — 3PLUS Control</h2><p>تجربة لإدارة المحلات وشكلها وصلاحيات الإعدادات. ليست لوحة تحكم حقيقية على السيرفر.</p></div>`+stats([['المحلات',state.shops.length],['نشط',state.shops.filter(x=>x.active).length],['موقوف',state.shops.filter(x=>!x.active).length],['الاشتراكات','تجريبية']])+`<div class="tiles" style="margin-top:18px"><button class="tile" onclick="go('shops')"><span class="emoji">🏬</span>إدارة المحلات</button><button class="tile" onclick="go('theme')"><span class="emoji">🎨</span>الألوان والقوالب</button><button class="tile" onclick="go('users')"><span class="emoji">👥</span>الصلاحيات</button></div>`;case 'shops':return head('إدارة المحلات')+`<div class="actions"><button class="btn" id="addShop">+ إضافة محل تجريبي</button></div><div class="panel">${state.shops.map(s=>`<div class="perm"><span>${esc(s.name)} <span class="tag">${s.active?'نشط':'موقوف'}</span></span><button class="btn alt" data-shop="${s.id}">${s.active?'إيقاف':'تفعيل'}</button></div>`).join('')}</div>`;case 'users':return head('المستخدمون والصلاحيات')+`<div class="panel"><h3>ما يُسمح للعميل بتعديله</h3><p class="muted">الإعدادات محدودة افتراضيًا حسب اختيار مالك النظام.</p>${Object.entries(state.permissions).map(([k,v])=>`<label class="perm"><span>${esc(({settings:'إظهار قسم الإعدادات',staff:'إدارة الموظفين',opening:'تعديل الرصيد الافتتاحي',closing:'تعديل موعد التقفيل',branding:'تغيير اللون واللوجو',whatsapp:'إعدادات واتساب'})[k])}</span><input type="checkbox" class="switch" data-perm="${k}" ${v?'checked':''}></label>`).join('')}</div><p class="muted">دي تغييرات معاينة محلية فقط. منع الصلاحيات الحقيقي يحتاج سياسات RLS واختبارها.</p>`;case 'theme':return head('التحكم في الألوان والقوالب')+`<div class="panel"><h3>اللون الأساسي</h3><div class="colors">${['#f4c542','#3589e7','#30bc7e','#9c6aec','#db5b61'].map(c=>`<button aria-label="لون ${c}" title="${c}" class="swatch ${state.color===c?'selected':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div><h3 style="margin-top:24px">القالب</h3><div class="fields"><div class="field"><label>قالب واجهة المحل</label><select id="template"><option value="cards" ${state.template==='cards'?'selected':''}>كروت كبيرة — التصميم المعتمد</option><option value="classic" ${state.template==='classic'?'selected':''}>كلاسيكي (مخطط للتنفيذ)</option><option value="compact" ${state.template==='compact'?'selected':''}>مختصر (مخطط للتنفيذ)</option></select></div></div><p class="muted">تغيير اللون يعمل في المعاينة؛ القوالب الأخرى لم تُبرمج كواجهات مستقلة بعد.</p></div>`;case 'order':return head('ترتيب الأقسام')+`<div class="panel"><p class="muted">تغيير ترتيب القائمة في هذه المعاينة فقط:</p>${state.order.map((k,i)=>`<div class="perm"><span>${esc(({dashboard:'لوحة التحكم',repairs:'صيانة',losses:'مرتجع أو خسارة',accounts:'الدرج والحسابات',daily:'التقفيل اليومي',monthly:'الأرباح الشهرية',records:'سجل الصيانات',settings:'الإعدادات'})[k])}</span><span><button class="btn alt" data-up="${i}" aria-label="رفع">↑</button> <button class="btn alt" data-down="${i}" aria-label="خفض">↓</button></span></div>`).join('')}</div>`;case 'subscriptions':return head('الاشتراكات')+`<div class="panel"><h3>الاشتراكات المدفوعة</h3><p class="muted">شكل القسم جاهز للمعاينة. الدفع الحقيقي، تاريخ انتهاء الباقات، وتعليق حساب العميل لم تُنفّذ بعد.</p></div>`;case 'updates':return head('التحديثات والدعم')+`<div class="panel"><h3>التحديثات والنسخ الاحتياطي</h3><p class="muted">يحتاج التنفيذ الحقيقي آليات سيرفر، وجدولة آمنة وتجربة استرجاع، وليس HTML فقط.</p></div>`;default:return ''}}
function modal(title,body,fn){$('mt').textContent=title;$('mb').innerHTML=body;$('merr').textContent='';dlgSave=fn;$('modal').showModal()};function field(name,id,value='',type='text'){return `<div class="field"><label for="f_${id}">${name}</label><input id="f_${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''} required></div>`};function v(id){return $('f_'+id).value.trim()};function editRepair(id){let r=state.repairs.find(x=>x.id===id)||{client:'',phone:'',device:'',fault:'',price:0,paid:0,status:statuses[0]};modal(id?'تعديل الصيانة':'إضافة صيانة جديدة',`<div class="fields">${field('اسم العميل','client',r.client)}${field('رقم الموبايل','phone',r.phone)}${field('نوع الجهاز','device',r.device)}${field('العطل','fault',r.fault)}${field('السعر','price',r.price,'number')}${field('المقبوض','paid',r.paid,'number')}<div class="field"><label>حالة الصيانة</label><select id="f_status">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`,()=>{if(!v('client')||!v('device')||!v('fault'))throw Error('أكمل بيانات العميل والجهاز والعطل');if(+v('paid')>+v('price'))throw Error('المقبوض أكبر من السعر');Object.assign(r,{client:v('client'),phone:v('phone'),device:v('device'),fault:v('fault'),price:+v('price'),paid:+v('paid'),status:v('status')});if(!id){r.id=Date.now();r.date=new Date().toISOString().slice(0,10);state.repairs.push(r)}persist()})}function wire(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRepair(+b.dataset.edit));if($('newRepair'))$('newRepair').onclick=()=>editRepair(null);if($('newLoss'))$('newLoss').onclick=()=>modal('إضافة مرتجع أو خسارة',`<div class="fields"><div class="field"><label>النوع</label><select id="f_kind"><option>خسارة</option><option>مرتجع</option></select></div>${field('السبب','reason')}${field('المبلغ','amount',0,'number')}</div>`,()=>{if(!v('reason')||+v('amount')<=0)throw Error('أدخل سببًا ومبلغًا صحيحًا');state.losses.push({kind:v('kind'),reason:v('reason'),amount:+v('amount'),date:new Date().toISOString().slice(0,10)});persist()});if($('newMove'))$('newMove').onclick=()=>modal('حركة مالية تجريبية',`<div class="fields"><div class="field"><label>الحساب</label><select id="f_account">${Object.keys(state.accounts).map(a=>`<option>${a}</option>`).join('')}</select></div><div class="field"><label>نوع الحركة</label><select id="f_kind"><option value="in">إيداع</option><option value="out">سحب</option></select></div>${field('المبلغ','amount',0,'number')}</div>`,()=>{const n=+v('amount'),a=v('account'),k=v('kind');if(n<=0)throw Error('المبلغ يجب أن يكون أكبر من صفر');if(k==='out'&&state.accounts[a]<n)throw Error('الرصيد غير كافٍ');state.accounts[a]+=(k==='in'?n:-n);state.movements.unshift({account:a,kind:k==='in'?'إيداع':'سحب',amount:n,date:new Date().toISOString().slice(0,10)});persist()});if($('addShop'))$('addShop').onclick=()=>modal('إضافة محل للمعاينة',field('اسم المحل','name'),()=>{if(!v('name'))throw Error('اكتب اسم المحل');state.shops.push({id:Date.now(),name:v('name'),active:true,plan:'تجريبي'});persist()});document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{const s=state.shops.find(s=>s.id==b.dataset.shop);s.active=!s.active;persist()});document.querySelectorAll('[data-perm]').forEach(b=>b.onchange=()=>{state.permissions[b.dataset.perm]=b.checked;persist()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;persist()});if($('template'))$('template').onchange=e=>{state.template=e.target.value;persist()};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;if(i>0){[state.order[i-1],state.order[i]]=[state.order[i],state.order[i-1]];persist()}});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;if(i<state.order.length-1){[state.order[i+1],state.order[i]]=[state.order[i],state.order[i+1]];persist()}})};$('menu').onclick=()=>$('side').classList.toggle('open');$('mode').onclick=()=>{control=!control;page=control?'control':'home';render()};$('cancel').onclick=()=>$('modal').close();$('save').onclick=()=>{try{dlgSave?.();$('modal').close()}catch(e){$('merr').textContent=e.message}};$('logout').onclick=()=>alert('تسجيل الدخول والخروج الحقيقي غير مفعّل في نسخة المعاينة.');$('language').onclick=()=>alert('الترجمة الإنجليزية ضمن مرحلة التنفيذ التالية.');render();
</script></body></html>
